name: Publish KT ServiceNow product releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-product-releases-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish product releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            shift 3

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; leaving it unchanged."
              return 0
            fi

            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              "$@"
          }

          publish_release \
            "incident-v1.3.2" \
            "Advanced Incident Management v1.3.2" \
            "KT Advanced Incident Management / KT Analysis package snapshot with the current repository installation guide." \
            "advanced-incident-management/package/kt-analysis-v1.3.2-2024-07-12.xml#ServiceNow application package" \
            "advanced-incident-management/docs/current/installation-guide.docx#Installation guide"

          publish_release \
            "case-v1.0.2" \
            "Advanced Case Management v1.0.2" \
            "KT Advanced Case Management package snapshot with the current repository installation guide." \
            "advanced-case-management/package/advanced-case-management-v1.0.2-2024-07-12.xml#ServiceNow application package" \
            "advanced-case-management/docs/current/installation-guide.docx#Installation guide"

          publish_release \
            "problem-2024-07-12" \
            "Advanced Problem Management (RCA) - 2024-07-12 package snapshot" \
            "KT Advanced Problem Management (RCA) package snapshot. The repository export does not expose a safely verified semantic version in the current audit, so this release is intentionally dated rather than assigned an invented version." \
            "advanced-problem-management/package/advanced-problem-management-rca-2024-07-12.xml#ServiceNow application package" \
            "advanced-problem-management/docs/current/installation-guide.docx#Installation guide"
